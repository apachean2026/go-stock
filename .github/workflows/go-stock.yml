name: Go Stock

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Check Go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...
